name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      # Installs Node, the pinned pnpm (package.json `packageManager`) and dependencies, with the store cached.
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: '24'
          cache: true

      # Restores Vite Task results; the fingerprints inside decide which tasks still hit.
      - name: Restore Vite Task cache
        id: vite-task-cache
        uses: actions/cache/restore@v6
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-

      # Lint; tsgolint supplies types to the type-aware rules but doesn't type-check (lint.options.typeCheck).
      - run: vp check
      # tsc-rs over every project, with the Effect diagnostics.
      - run: vp run typecheck
      # Unused files and dependencies; unused exports are off (knip.json).
      - run: pnpm exec knip

      - name: Save Vite Task cache
        if: success()
        uses: actions/cache/save@v6
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.vite-task-cache.outputs.cache-primary-key }}

  # Mochi ships for macOS, Windows and Linux: the tests and an unpacked build run on each (installers are `electron-builder` without `--dir`).
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # On a pull request HEAD is the merge commit and HEAD~1 the base it merges into, so two commits are enough for `--changed`.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: '24'
          cache: true

      # Restores Vite Task results; the fingerprints inside decide which tasks still hit.
      - name: Restore Vite Task cache
        id: vite-task-cache
        uses: actions/cache/restore@v6
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      # A pull request runs only the tests its diff reaches (vite.config.ts `forceRerunTriggers` widens that to all); main runs every test.
      # macOS replays cached results. Windows runs `vp test` directly: under `vp run` the tracked child processes (`sh`, git) die with 0xC0000142 (STATUS_DLL_INIT_FAILED).
      # Ubuntu runs it directly too, to print a v8 coverage summary (no gate): vitest wipes ./coverage, which `vp run` records as a changed input.
      - run: ${{ matrix.os == 'macos-latest' && 'vp run test' || 'vp test run' }} ${{ github.event_name == 'pull_request' && '--changed HEAD~1' || '' }} ${{ matrix.os == 'ubuntu-latest' && '--coverage' || '' }}
      # electron:build minus its `tsc` steps, which the check job runs.
      - run: pnpm electron:pack

      - name: Save Vite Task cache
        if: success()
        uses: actions/cache/save@v6
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.vite-task-cache.outputs.cache-primary-key }}

      # Runs every spec in tests/e2e: stream.perf.spec.ts streams a reply into the built app and fails over its render and script budgets; browser.spec.ts drives the browser views through the CDP relay.
      # Ubuntu 24.04's AppArmor blocks the user namespaces Chromium's sandbox needs.
      - if: matrix.os == 'ubuntu-latest'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # No display on the runner: Electron draws into a virtual X server.
      - if: matrix.os == 'ubuntu-latest'
        run: xvfb-run --auto-servernum pnpm exec playwright test -c tests/e2e
