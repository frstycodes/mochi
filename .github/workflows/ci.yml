name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # Installs Node, the pinned pnpm (package.json `packageManager`) and dependencies, with the store cached.
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: '24'
          cache: true

      # Lint plus type checks for src and electron (TypeScript Go via tsgolint).
      - run: vp check
      # Adds electron and infra/relay beyond the `tsc -b` inside `vp run build`; the matrix job's electron:build covers electron on each OS.
      - run: pnpm typecheck
      # `vp test` is Vitest; the suite is node:test, so run the package script.
      - run: vp run test
      - run: vp run build

  # Streams a reply into the built app; fails over the render and script budgets in tests/e2e/stream.perf.spec.ts.
  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: '24'
          cache: true
      - run: vp build --mode electron
      # Ubuntu 24.04's AppArmor blocks the user namespaces Chromium's sandbox needs.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # No display on the runner: Electron draws into a virtual X server.
      - run: xvfb-run --auto-servernum pnpm exec playwright test -c tests/e2e

  # Mochi ships for macOS, Windows and Linux: the tests and an unpacked build run on each (installers are `electron-builder` without `--dir`).
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: '24'
          cache: true
      - run: vp run test
      - run: vp run electron:build
