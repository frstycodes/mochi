<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Mochi</title>
    <!-- next-themes' saved choice, applied before first paint so the splash matches it; next-themes takes over once React runs. -->
    <script>
      try {
        const theme = localStorage.getItem('theme');
        if (theme === 'light' || theme === 'dark')
          document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    <!-- The splash until React's first render replaces #root; src/main.tsx writes each boot stage into .splash-stage. Colours are index.css's default --background/--foreground; electron/window.ts paints the same background before this. -->
    <style>
      .splash {
        --splash-bg: oklch(0.982 0.003 285);
        --splash-fg: oklch(0.235 0.01 285);
        --splash-shadow: oklch(0.2 0.02 285 / 0.12);
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: var(--splash-bg);
        color: var(--splash-fg);
        font:
          14px/20px system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        animation: splash-in 400ms cubic-bezier(0.23, 1, 0.32, 1) 150ms both;
      }
      :root[data-theme='dark'] .splash {
        --splash-bg: oklch(0.185 0.006 285);
        --splash-fg: oklch(0.93 0.004 285);
        --splash-shadow: oklch(0.05 0.01 285 / 0.6);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) .splash {
          --splash-bg: oklch(0.185 0.006 285);
          --splash-fg: oklch(0.93 0.004 285);
          --splash-shadow: oklch(0.05 0.01 285 / 0.6);
        }
      }
      /* Light: a dark dome whose top catches the light; dark: a light dome fading toward its base. */
      .splash-lit-top {
        stop-opacity: 0.62;
      }
      .splash-lit-bottom {
        stop-opacity: 0.88;
      }
      :root[data-theme='dark'] .splash-lit-top {
        stop-opacity: 0.9;
      }
      :root[data-theme='dark'] .splash-lit-bottom {
        stop-opacity: 0.55;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) .splash-lit-top {
          stop-opacity: 0.9;
        }
        :root:not([data-theme='light']) .splash-lit-bottom {
          stop-opacity: 0.55;
        }
      }
      .splash-mochi {
        width: 80px;
        overflow: visible;
      }
      .splash-mochi * {
        transform-box: fill-box;
      }
      .splash-body {
        transform-origin: 50% 100%;
        animation: splash-squish 2.4s ease-in-out infinite;
      }
      .splash-shadow {
        fill: var(--splash-shadow);
        transform-origin: 50% 50%;
        animation: splash-shadow 2.4s ease-in-out infinite;
      }
      .splash-eye {
        fill: var(--splash-bg);
        transform-origin: 50% 50%;
        animation: splash-blink 4.2s ease-in-out 1s infinite;
      }
      .splash-stage {
        margin: 0;
        letter-spacing: 0.01em;
        /* The app's in-progress shimmer (index.css .mask-shimmer): a 1.1s sweep, then 1.2s rest. */
        mask-image: linear-gradient(
          90deg,
          rgb(0 0 0 / 0.6) 40%,
          #000 50%,
          rgb(0 0 0 / 0.6) 60%
        );
        mask-size: 250% 100%;
        animation: splash-shimmer 2.3s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }
      @keyframes splash-in {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
      }
      @keyframes splash-squish {
        50% {
          transform: scale(1.04, 0.95);
        }
      }
      @keyframes splash-shadow {
        50% {
          transform: scaleX(1.08);
        }
      }
      @keyframes splash-blink {
        0%,
        92%,
        100% {
          transform: scaleY(1);
        }
        95% {
          transform: scaleY(0.1);
        }
      }
      @keyframes splash-shimmer {
        0% {
          mask-position: 100% center;
        }
        48%,
        100% {
          mask-position: 0% center;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash {
          animation-name: splash-fade;
        }
        .splash-body,
        .splash-shadow,
        .splash-eye {
          animation: none;
        }
        .splash-stage {
          animation-duration: 4.6s;
        }
        @keyframes splash-fade {
          from {
            opacity: 0;
          }
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash" role="status">
        <!-- MochiMark's dome (src/ui.tsx), lit from above, with the eye drawn separately so it can blink. -->
        <svg class="splash-mochi" viewBox="14 26 72 60" aria-hidden="true">
          <defs>
            <linearGradient id="splash-lit" x1="0" y1="0" x2="0" y2="1">
              <stop
                class="splash-lit-top"
                offset="0"
                stop-color="currentColor"
              />
              <stop
                class="splash-lit-bottom"
                offset="1"
                stop-color="currentColor"
              />
            </linearGradient>
          </defs>
          <ellipse class="splash-shadow" cx="50" cy="82" rx="28" ry="2.5" />
          <g class="splash-body">
            <path
              d="M18 70 C18 44 32 30 50 30 C68 30 82 44 82 70 C82 76 78 78 72 78 L28 78 C22 78 18 76 18 70 Z"
              fill="url(#splash-lit)"
            />
            <circle class="splash-eye" cx="58" cy="52" r="5" />
          </g>
        </svg>
        <p class="splash-stage">Starting Mochi…</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
