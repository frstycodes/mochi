<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Mochi</title>
    <!-- next-themes' saved choice, applied before first paint so the splash matches it; next-themes takes over once React runs. -->
    <script>
      try {
        const theme = localStorage.getItem('theme');
        if (theme === 'light' || theme === 'dark')
          document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    <!-- The splash until React's first render replaces #root. Colours are index.css's default --background/--foreground; electron/window.ts paints the same background before this. -->
    <style>
      .splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: oklch(0.982 0.003 285);
        color: oklch(0.235 0.01 285 / 0.22);
      }
      :root[data-theme='dark'] .splash {
        background: oklch(0.185 0.006 285);
        color: oklch(0.93 0.004 285 / 0.22);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) .splash {
          background: oklch(0.185 0.006 285);
          color: oklch(0.93 0.004 285 / 0.22);
        }
      }
      .splash svg {
        width: 64px;
        animation:
          splash-in 300ms cubic-bezier(0.23, 1, 0.32, 1) 150ms both,
          splash-breathe 1.4s ease-in-out 450ms infinite alternate;
      }
      @keyframes splash-in {
        from {
          opacity: 0;
          transform: scale(0.95);
        }
      }
      @keyframes splash-breathe {
        to {
          opacity: 0.5;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash svg {
          animation: splash-in 300ms linear 150ms both;
        }
        @keyframes splash-in {
          from {
            opacity: 0;
          }
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash" role="status" aria-label="Loading Mochi">
        <!-- MochiMark in src/ui.tsx; held on screen at #splash (src/design/SplashPage.tsx) -->
        <svg viewBox="14 26 72 56" aria-hidden="true">
          <path
            d="M18 70 C18 44 32 30 50 30 C68 30 82 44 82 70 C82 76 78 78 72 78 L28 78 C22 78 18 76 18 70 Z M63 52 A5 5 0 1 0 53 52 A5 5 0 1 0 63 52 Z"
            fill="currentColor"
            fill-rule="evenodd"
          />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
